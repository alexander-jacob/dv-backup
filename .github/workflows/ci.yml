name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go test ./...
      - run: docker info --format '{{.ServerVersion}}'
      - run: go test -tags integration ./internal/dockerx/ ./internal/integration/ -v -count=1 -timeout 20m
