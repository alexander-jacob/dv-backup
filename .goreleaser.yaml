version: 2
project_name: dv-backup
builds:
  - main: ./cmd/dv-backup
    binary: dv-backup
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/alexander-jacob/dv-backup/internal/version.Version={{.Version}}
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: checksums.txt
release:
  draft: false
changelog:
  use: git
